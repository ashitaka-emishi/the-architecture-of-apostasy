name: Theological Consistency

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  grammar-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run theological consistency check
        run: python3 ai-system/scripts/theological_consistency_check.py

project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "markdown/*.md"
    - "!markdown/state-dressed-religion.md"
    - "!markdown/disease-logos.md"
    - "!markdown/gettysburg-national-military-park-as-national-temple.md"
    - "!markdown/the-fallen-liturgies-of-american-politics.md"
    - "!markdown/disease-logos-and-care-for-the-long-afflicted.md"
    - "!markdown/from-hypocrisy-to-disease-logos.md"
    - "!markdown/hypocrisy-chapter-draft.md"
  resources:
    - "CNAME"
    - "gallery/apple-touch-icon.png"
    - "gallery/aoa-social-preview.jpg"
    - "raw/**/*.pdf"
    - "raw/images/**/*.txt"
    - "site-assets/**"

website:
  title: "The Architecture of Apostasy"
  description: "A Christian path of return from false embodiment into Christ."
  site-url: "https://architecture-of-apostasy.faith"
  favicon: gallery/architecture-of-apostasy-favicon.png
  open-graph: true
  twitter-card: true
  navbar:
    title: false
    logo: gallery/aoa-logo-emblem.webp
    logo-alt: "The Architecture of Apostasy"
    left:
      - href: index.qmd
        text: Home
      - href: path-of-re-embodiment.qmd
        text: The Path
      - href: church.qmd
        text: The Church
      - text: Library
        menu:
          - href: foundations.qmd
            text: Foundations
          - href: readers-guide.qmd
            text: Reader's Guide
          - href: method.qmd
            text: Method
          - href: rival-readings.qmd
            text: Rival Readings
          - href: document-intake-covenant.qmd
            text: Document Intake
          - href: faithful-institutions.qmd
            text: Faithful Institutions
          - href: archive.qmd
            text: Archive
          - href: core-concepts.qmd
            text: Core Concepts
          - href: reading-paths.qmd
            text: Reading Paths
          - href: essays.qmd
            text: Essays
          - href: images.qmd
            text: Images
          - href: songs.qmd
            text: Songs
          - href: discussions.qmd
            text: Discussions
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/ashitaka-emishi/the-architecture-of-apostasy
        aria-label: GitHub repository
  page-footer:
    left: "The Architecture of Apostasy"
    right: "A path of return from false embodiment into Christ."
  search: true

format:
  html:
    theme: darkly
    css: styles.css
    include-in-header: site-assets/brand-icons.html
    include-after-body: site-assets/image-viewer.html
    toc: true
    toc-depth: 3
    smooth-scroll: true
    link-external-newwindow: true
    anchor-sections: true

    - "site-assets/**"

website:
  title: "The Architecture of Apostasy"
  description: "A Christian path of return from false embodiment into Christ."
  site-url: "https://architecture-of-apostasy.faith"
  favicon: gallery/architecture-of-apostasy-favicon.png
  open-graph: true
  twitter-card: true
  navbar:
    title: false
    logo: gallery/aoa-logo-emblem.webp
    logo-alt: "The Architecture of Apostasy"
    left:
      - href: index.qmd
        text: Home
      - href: path.qmd
        text: The Path
      - href: keeping.qmd
        text: The Keeping
      - href: measure.qmd
        text: The Measure
      - text: Library
        menu:
          - href: library.qmd
            text: Library Catalog
          - href: foundations.qmd
            text: Foundations
          - href: readers-guide.qmd
            text: Reader's Guide
          - href: method.qmd
            text: Method
          - href: essays.qmd
            text: Essays
          - href: images.qmd
            text: Images
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/ashitaka-emishi/the-architecture-of-apostasy
        aria-label: GitHub repository
  page-footer:
    center: "The Architecture of Apostasy - A path to be kept. A keeping under Christ. A measure not our own."
  search: true

format:
  html:
    theme: darkly
    css: styles.css
    include-in-header: site-assets/brand-icons.html
    include-after-body: site-assets/image-viewer.html
    toc: true
    toc-depth: 3
    smooth-scroll: true
    link-external-newwindow: true
    anchor-sections: true
